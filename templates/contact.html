{% include "header.html" %}

<!-- Page Header -->
<header class="masthead" style="background-image: url('{{ url_for('static', filename='img/contact-bg.jpg') }}')">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-md-10 mx-auto">
                <div class="page-heading animate-in">
                    <h1>Contact Me</h1>
                    <hr class="accent-divider">
                    <span class="subheading">Let's start a conversation</span>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Contact Form -->
<div class="section-wrap">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-md-10 mx-auto">
                <p class="contact-lead animate-in">
                    Have something on your mind? Fill out the form below and I'll get back to you as soon as possible.
                </p>
                <div class="form-card animate-in delay-1">
                    <form name="sentMessage" id="contactForm" action="/contact" method="post" novalidate>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="name">Name</label>
                                    <input type="text" class="form-control" placeholder="Your name" name="name"
                                           id="name"
                                           required data-validation-required-message="Please enter your name.">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="email">Email Address</label>
                                    <input type="email" class="form-control" name="email" placeholder="your@email.com"
                                           id="email"
                                           required data-validation-required-message="Please enter your email address.">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" class="form-control" name="num" placeholder="+1 (555) 000-0000" id="phone"
                                   required data-validation-required-message="Please enter your phone number.">
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea rows="5" class="form-control" name="msg" placeholder="Write your message here…"
                                      id="message" required
                                      data-validation-required-message="Please enter a message."></textarea>
                        </div>
                        <div id="success" style="margin-bottom: 1rem;"></div>
                        <button type="submit" class="btn btn-primary" id="sendMessageButton">
                            <i class="fas fa-paper-plane" style="font-size:0.7rem;"></i> Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% include "footer.html" %}
